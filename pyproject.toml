[project]
name = "omnibowl"
version = "0.0.1"
description = "Turn a textbook into quizbowl tossups."
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "fastcoref>=2.1.6",
    "pymupdf>=1.28.2",
    "spacy>=3.8.16",
    "transformers<5",
    "wordfreq>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "pipeline"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["pipeline/tests"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
