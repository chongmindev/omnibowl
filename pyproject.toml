[project]
name = "omnibowl"
version = "0.0.1"
description = "Turn a textbook into quizbowl tossups."
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.2",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "pipeline"

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["pipeline/tests"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
