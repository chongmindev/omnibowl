# All thresholds and weights for the pipeline. No magic numbers in code.
# Everything here must hold for any textbook; per-book facts are discovered into
# data/profiles/<book>.auto.toml (see pipeline/omnibowl/profile.py).

[paths]
db = "data/omnibowl.db"
qbreader_cache = "data/qbreader_cache"
profiles = "data/profiles"
# Hand corrections to profiles: committed, since they are design decisions.
profile_overrides = "profiles"

[parse]
# A filled drawing counts as a "panel" (box background) when every RGB channel is
# at least this light, and it is not pure white (page background).
panel_min_channel = 0.80
panel_white_channel = 0.99
# Ignore filled drawings thinner than this (rules, underlines), in points.
panel_min_height = 5.0
# A line belongs to an outline entry if its top is at or below the entry's
# destination y minus this many points.
outline_y_tolerance = 4.0
# Matching an outline title to its heading line: compare at least this many
# alphanumeric characters, so a stray short line ("1") cannot match.
heading_match_min_chars = 4
# Two-column pages: at least this many lines wholly on each side of the midline, and
# at most this share of lines crossing it.
columns_min_lines = 8
columns_max_cross_frac = 0.15

[profile]
# Size peaks: rel_size is binned to this width; a bin is a peak if it holds at least
# this share of content characters.
size_bin = 0.01
min_peak_share = 0.002
# Furniture: top/bottom margin zone as a share of page height; a pattern is furniture
# if it appears there on at least this share of content pages.
margin_zone = 0.06
furniture_min_page_share = 0.3
# Generic share threshold for a role guess ("most of them").
role_share = 0.5
# Lines ending in "?" above this share read as questions (objective or exercise).
question_share = 0.3
url_share = 0.2
# Panel styles: ignore styles with fewer lines; a definition panel is short; an
# objective panel is short and question-like; a table has short cells in several
# x-columns (x binned to 10 pt, a column needs this share of the style's lines).
panel_min_lines = 5
definition_max_lines = 6
objective_max_lines = 6
table_cell_max_chars = 30
table_x_min_share = 0.05
table_min_columns = 3
# Markers: recurring bold lines of at most this many words, seen at least this many
# times in this many top-level chapters. Content is sampled from the lines after each.
marker_max_words = 6
marker_min_count = 5
marker_min_chapters = 3
marker_sample_lines = 12
caption_prefixes = ["Figure", "Fig.", "Table", "Exhibit"]
# Back-matter parts: ignore parts with fewer lines; an index has at least this share
# of lines carrying page links; a glossary at least this share of bold-start lines.
back_matter_min_lines = 20
index_link_share = 0.5
glossary_bold_share = 0.2
# Glossary terms are at most this many words, and at least this share of them occur in
# the chapters (a bilingual glossary's other language does not).
glossary_term_max_words = 6
glossary_in_text_share = 0.4

# Words in a marker that decide its role before content statistics are consulted.
# English textbook vocabulary, not tied to one book.
[profile.role_lexicon]
exercise = ["question", "questions", "exercise", "exercises", "activity", "practice",
            "test", "quiz", "project", "check", "answer", "answers", "problem", "problems",
            "frq", "frqs", "points", "rubric", "contemplate", "try", "discussion", "yourself"]
objective = ["objective", "objectives", "target", "targets", "goals", "outcomes"]
summary = ["review", "summary", "recap", "remember", "takeaways"]
table = ["table"]

[tag]
# A run of at least this many consecutive non-bold above-body lines is display prose
# (a chapter opener set large), not a heading; titles run one or two lines.
display_prose_min_lines = 3
# A line set entirely in bold, at most this many words, not ending in sentence
# punctuation, standing alone on its row, is a heading (inside boxes, and at body
# size elsewhere). Bold share at or above this counts as "entirely".
inline_heading_max_words = 8
inline_heading_min_bold = 0.95
# Side-stream lines indented at least this far (points) past the chapter's body
# margin are numbered examples, not continuations of a caption or definition.
example_min_indent = 12.0
# Lines to scan after a marker for its panel before treating the region as open.
panel_search_lines = 8
# A line whose top is within this many points of the previous line's top, on the same
# page and in the same size band, continues it (e.g. caption text beside "Figure 2.1").
same_row_tolerance = 2.0
# Inside a box, a caption continues on lines whose left edge is within this many
# points of the "Figure N.M" label; the box's next paragraph is indented further.
caption_continue_indent = 4.0

[sentences]
# Line kinds that produce sentences. Headings, drop caps (joined to their word),
# furniture, tables and front/back matter do not.
kinds = ["body", "box", "summary", "objective", "definition", "caption", "example", "exercise"]
spacy_model = "en_core_web_sm"
# Components not needed for sentence boundaries (the parser decides them).
spacy_exclude = ["ner", "lemmatizer"]
spacy_max_length = 2000000
spacy_batch_size = 64

[backmatter]
# An index line indented at least this many points past the part's usual left edge is
# a sub-entry of the entry above it.
subentry_min_indent = 8.0
# The part's left edge is the leftmost x shared by at least this share of its lines.
margin_min_share = 0.05

[candidates]
# A one-word concept merges into the person with that surname only if it is written
# capitalized at least this often ("Broca" yes; "memory", misread once as a name, no).
surname_min_capitalized = 0.5
# Sentence kinds that count as text about a term. Exercises, objectives and examples
# are left out (prompts and stimulus sentences, not facts).
sentence_kinds = ["body", "box", "summary", "definition", "caption"]
# Longest candidate, in words (adjectives, nouns, "of").
max_words = 5
# A term must be mentioned at least this many times to be kept at all.
min_mentions = 2
spacy_batch_size = 256
# Keyness log ratio: add this many per million to both frequencies, so terms unseen in
# everyday English do not divide by zero (Kilgarriff's "simple maths" N; larger values
# favor more frequent terms).
log_ratio_smoothing = 1.0
# Candidates containing any of these (as whole words) are dropped: academic and
# idiomatic boilerplate common in every textbook (general English, not book-specific).
phrase_stoplist = ["et", "al", "et al", "ibid", "other hand", "same time", "first place", "other word",
                   "month of age", "year-old", "period of time",
                   "such case", "most case", "many case", "some case", "this case",
                   "the end", "long way", "great deal", "large number", "small number"]
# Capitalized words that can sit before a year without being an author ("In 1861",
# "Since 2010"). English function words and months, not book-specific.
citation_name_stopwords = ["In", "By", "Since", "From", "Until", "Till", "Before", "After",
  "During", "The", "This", "That", "These", "Those", "As", "Of", "On", "At", "To", "For",
  "And", "Or", "But", "With", "Between", "Around", "About", "Circa", "Ca", "Only", "Around",
  "Early", "Late", "Mid", "Fall", "Spring", "Summer", "Winter", "Figure", "Table", "Box",
  "Chapter", "Section", "Unit", "Module", "Age", "Ages", "Year", "Years", "Today", "Then",
  "January", "February", "March", "April", "May", "June", "July", "August", "September",
  "October", "November", "December", "U.S.", "US", "UK", "Census"]
# A phrase opening with one of these determiner-like adjectives is dropped (the phrase
# without it is kept): "other languages" -> "languages". General English.
leading_modifiers = ["other", "different", "many", "same", "such", "various", "several",
  "certain", "specific", "particular", "new", "more", "most", "few", "own", "first",
  "second", "last", "next", "previous", "following", "typical", "general", "similar",
  "whole", "entire", "single", "real", "actual", "important", "possible", "simple",
  "large", "small", "good", "great", "main", "major", "key", "common", "usual"]
# A multi-word term whose mentions sit at least this often inside a longer term's
# mentions is a fragment of it and is dropped.
subsumed_share = 0.9
# Head words treated as one when grouping variants ("color terms" ~ "color words").
# The first word of each list names the group. General English, not book-specific.
synonym_heads = [["term", "word", "name", "label", "vocabulary"],
                 ["study", "experiment"],
                 ["effect", "phenomenon"]]

[candidates.classes]
# Hand-set lines (decision X, 2026-10-08); tune against labels (Y) only if these fail.
too_broad_min_chapters = 10
# Broad answers (decision "broad answers", B + A, 2026-10-10): a too_broad term becomes
# `broad_answer` if the book treats it as a topic (glossary entry, chapter or section
# heading, or subject-index head with at least this many subentries) ...
broad_min_index_subentries = 3
# A heading title used more than this many times is furniture, not a topic.
broad_max_heading_repeats = 1
# Topic names shorter than this (index letter dividers "A", "B") are ignored.
broad_min_name_chars = 3
# ... or, when true, if it also clears the answer keyness line below. Off since
# 2026-10-10: in batches 16-19 the keyness-only route gave no usable tossups.
broad_by_keyness = false
# Answers made only of everyday/broad words of the book become clue_only (F3, 2026-10-10).
generic_answer_filter = true
answer_min_sentences = 5
# Lowered from 4.0 / 100 on 2026-10-10 (more answers for the v1 rewrite; F3 filters junk).
answer_log_ratio = 3.5
answer_local_mi = 75.0
floor_log_ratio = 2.0
floor_local_mi = 50.0

[coref]
# Local pretrained coreference model (decision 2026-10-08): fastcoref's F-coref, MIT
# license, pinned to a revision. Downloaded once to ~/.cache/huggingface.
model = "biu-nlp/f-coref"
revision = "e91dfff12879495d882ba9460d0c5d5dd44ade59"
device = "auto"            # mps on Apple silicon, else cpu
max_tokens_in_batch = 4000

[clues]
# Sentence kinds that can be clues. Exercises, objectives and examples never are.
sentence_kinds = ["body", "box", "summary", "definition", "caption"]
# Terms that get clues: answers now; clue_only terms can be added later as sources of
# clues about other answers.
term_classes = ["answer", "broad_answer"]
# A clause shorter than this many words is not a clue on its own.
min_words = 5

[rank]
# Difficulty = w_emphasis * emphasis + w_specificity * specificity (decision C, rough).
w_emphasis = 0.6
w_specificity = 0.4
# Emphasis by where the clue sits: 0 = the book makes it easy, 1 = buried.
coref_penalty = 0.1
off_chapter_penalty = 0.15
# Specificity: mean of the top N inverse sentence frequencies of the clue's words.
specificity_top_words = 3
specificity_stopwords = ["the", "and", "that", "this", "with", "from", "have", "were", "which",
  "their", "they", "them", "there", "these", "those", "been", "being", "into", "about", "than",
  "then", "when", "what", "while", "would", "could", "should", "also", "such", "more", "most",
  "some", "other", "only", "very", "just", "even", "both", "each", "many", "much", "over"]
generic_person = "researcher"
generic_concept = "term"
# Words too vague to be a referent ("this thing").
generic_categories = ["thing", "way", "term", "word", "kind", "type", "part", "case", "example",
                      "lot", "number", "set", "form", "fact", "idea", "notion", "one", "bit", "sort",
                      "pattern", "process", "property", "phenomenon", "aspect", "feature", "region"]

# Pool mode (`--stage assemble --pool`): drafts for the v1 hand-assisted rewrite.
# Grounding, leak checks and pronoun resolution stay; two strict wording rules relax,
# because the rewrite step sees each clue's source and previous sentence.
[assemble.pool]
min_topicality = 0.3
allow_unresolved_pronouns = true
skip_generic_referents = false     # the rewrite step chooses a proper referent

[assemble.topicality]
subject = 1.0
predicate = 0.8
object = 0.6
prepositional = 0.3
other = 0.5

[rank.emphasis]
definition = 0.0
summary = 0.2
bold_intro = 0.15
body = 0.5
box = 0.7
caption = 0.7

[assemble]
# Quizbowl conventions (CLAUDE.md): 4 to 7 sentences, about 500 to 700 characters.
min_sentences = 4
max_sentences = 7
min_chars = 350
max_chars = 750
max_clue_chars = 300
max_per_section = 3
# Broad answers (class broad_answer) take at most this many clues from one chapter.
broad_max_per_chapter = 1
# Clauses matching any of these address the reader or point at the book; not facts.
meta_patterns = ["\\byou\\b", "\\byour\\b", "\\bsee (?:figure|table|box|chapter|section|method)",
                 "\\bthis (?:chapter|section|subsection|book)\\b", "\\bas we(?:'ll| will)? see\\b",
                 "\\bwe(?:'ve| have) seen\\b", "\\bearlier in\\b", "\\blater in\\b",
                 "\\bI\\b", "\\bmy\\b", "\\bas (?:noted|mentioned|discussed|described) (?:earlier|above|before|previously)\\b",
                 "\\bthis (?:little )?(?:exercise|example|hypothetical|figure)\\b", "\\bhypothetical\\b"]
# Source lines and citations are not clues: "Smith & Jones, 1968", "(ed.)", "et al.".
source_patterns = ["\\bet al\\b", "\\(eds?\\.\\)", "&\\s*[A-Z][a-z]+,?\\s*\\d{4}",
                   "\\b(?:Adapted|Reprinted|Courtesy|Data) (?:from|of)\\b"]
# Wording rules (2026-10-09).
# Rule 1: a chain's name is its longest noun-phrase mention of at most this many words.
max_name_words = 8
# Rule 2: the answer's role in the clause; clauses below `min_topicality` are dropped.
min_topicality = 0.6
# Rule 3: trimmed from the start of a clue (regex alternatives, then a comma if any).
leading_connectives = ["But", "And", "So", "Thus", "Hence", "However", "Moreover", "Furthermore",
  "In fact", "Indeed", "Interestingly", "Importantly", "Crucially", "Notably", "Remarkably",
  "Surprisingly", "For instance", "For example", "In other words", "Of course", "Still", "Yet",
  "Also", "Similarly", "Likewise", "In addition", "Instead", "Ultimately", "Overall", "Finally",
  "Again", "Nevertheless", "Nonetheless", "As a result", "In short", "In turn", "Then",
  "At the same time", "On the other hand", "In contrast", "By contrast", "Specifically"]
frame_patterns = ["The general idea is that", "The idea is that", "There(?:'s|’s| is) (?:also )?(?:good |some |strong )?evidence that",
  "It turns out that", "It seems that", "It appears that", "This means that", "What this means is that",
  "The (?:basic|key|main) (?:point|insight|claim) is that", "In this view,"]
drop_parentheticals = true
# A clause more than this share quoted speech is an example, not a fact.
max_quoted_share = 0.4
# Answer filters (proposed 2026-10-09, on by default; turn off to compare).
skip_generic_referents = true
persons_need_citation_or_title = true
allow_unresolved_pronouns = false
category = "Social Science"
subcategory = "Psychology"
set_year = 0
pipeline_version = "0.1-rough"
